<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學生管理｜個人教學資源網</title><link rel="icon" href="../assets/icons/favicon.svg"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/auth.css"></head><body><header class="site-header"><a class="skip" href="#main">跳到主要內容</a><div class="nav-wrap"><a class="brand" href="../index.html"><span class="brand-mark">01</span><span>個人教學資源網</span></a><button class="menu-button" aria-controls="site-nav" aria-expanded="false">選單</button><nav id="site-nav" aria-label="主要導覽"><a href="../index.html">首頁</a><a href="../courses/index.html">課程</a><a href="../dashboard/">我的課程</a><a href="../about.html">關於老師</a></nav></div></header><main id="main"><div class="user-bar"><span data-user-name></span><a href="../account.html">變更密碼</a><button class="button ghost" data-logout hidden>登出</button></div><p class="status" data-status role="status" aria-live="polite" hidden></p><section class="page-intro"><p class="eyebrow">TEACHER</p><h1>學生管理</h1><p>新增學生、啟用／停用帳號，以及指定課程。</p></section><section class="admin-panel" id="admin-controls" hidden><h2 id="editor-title">新增學生</h2><form id="student-form" class="form-grid"><input name="uid" type="hidden"><div class="admin-grid"><label class="field">學生姓名<input name="name" maxlength="80" required></label><label class="field">學號<input name="studentId" maxlength="40" required></label><label class="field">班級<input name="className" maxlength="80" required></label><label class="field">Email／登入帳號<input name="email" type="email" autocomplete="off" required></label><label class="field" id="initial-password">初始密碼<input name="password" type="password" autocomplete="new-password" minlength="12"></label></div><fieldset><legend>授權課程</legend><div id="course-options"></div></fieldset><label class="check-field"><input type="checkbox" name="active" checked>啟用帳號</label><div class="actions"><button class="button primary" type=
