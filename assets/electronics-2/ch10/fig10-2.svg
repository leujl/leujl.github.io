<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360"><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#24323d}.t{font-size:24px;font-weight:700}.s{font-size:18px}.b{fill:#fff;stroke:#13899b;stroke-width:3}.a{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#555"/></marker></defs><rect x="25" y="70" width="205" height="210" rx="20" class="b"/><rect x="270" y="70" width="205" height="210" rx="20" class="b"/><rect x="515" y="70" width="220" height="210" rx="20" class="b"/><rect x="775" y="70" width="175" height="210" rx="20" class="b"/><text x="127" y="120" text-anchor="middle" class="t">① 差動輸入</text><text x="127" y="155" text-anchor="middle" class="s">高輸入阻抗</text><text x="127" y="185" text-anchor="middle" class="s">放大兩輸入端差值</text><text x="372" y="120" text-anchor="middle" class="t">② 高增益</text><text x="372" y="155" text-anchor="middle" class="s">電壓放大級</text><text x="372" y="190" text-anchor="middle" class="s">Avo ≫ 1</text><text x="625" y="120" text-anchor="middle" class="t">③ 輸出級</text><text x="625" y="155" text-anchor="middle" class="s">射極隨耦器</text><text x="625" y="185" text-anchor="middle" class="s">低輸出阻抗</text><text x="862" y="120" text-anchor="middle" class="t">④ 定電流源</text><text x="862" y="155" text-anchor="middle" class="s">提供各級穩定</text><text x="862" y="185" text-anchor="middle" class="s">直流偏壓電流</text><path d="M230 175H270M475 175H515M735 175H775" class="a"/><text x="15" y="40" class="s">Vi(−)、Vi(+)</text><text x="880" y="330" class="s">Vo</text></svg>